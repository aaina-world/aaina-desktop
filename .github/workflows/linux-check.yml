name: Linux check

# Opens a release's Linux build on a fresh Ubuntu machine with different WebKit settings and keeps a screenshot of each.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.0

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # drafts are only visible with write access
    steps:
      - name: Download the .deb from the release (drafts too)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "*.deb"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick dbus-x11 gnome-keyring ./*.deb
      - name: Open it three ways
        run: |
          Xvfb :99 -screen 0 1440x900x24 & sleep 2
          export DISPLAY=:99
          shot() { # name, then an optional VAR=1
            dbus-run-session -- env $2 sh -c 'aaina-desktop & app=$!; sleep 25; import -window root "$0.png"; kill $app' "$1" || true
            sleep 2
          }
          shot plain
          # With a keychain running and unlocked, as on a normal Linux desktop.
          dbus-run-session -- sh -c 'echo -n test | gnome-keyring-daemon --unlock --components=secrets >/dev/null; aaina-desktop & app=$!; sleep 25; import -window root keyring.png; kill $app' || true
          ls -la *.png
          mkdir -p logs; cp -r ~/.local/share/world.aaina.desktop/logs/* logs/ 2>/dev/null || true
          find ~/.local/share/world.aaina.desktop ~/.config/world.aaina.desktop -maxdepth 2 2>/dev/null | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: linux-check
          path: |
            *.png
            logs/
