name: Store packages

# Installs the current release the way people will from each free store, on fresh machines, before anything is submitted:
# Flathub (Linux), winget (Windows) and our Homebrew tap (Mac). Each job builds or installs from the files in packaging/,
# runs the store's own checks, opens the app and keeps a screenshot (Artifacts).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packaging/**", ".github/workflows/packaging.yml"]

jobs:
  flathub:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream xvfb dbus-x11 gnome-keyring imagemagick
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.flatpak.Builder
      - name: Flathub's own checks (manifest and app data)
        working-directory: packaging/flathub
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest world.aaina.AainaDesktop.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream world.aaina.AainaDesktop.metainfo.xml
      - name: Build and install
        working-directory: packaging/flathub
        # Installing the runtime needs a session bus, which a CI machine doesn't start on its own.
        run: dbus-run-session -- flatpak run org.flatpak.Builder --user --install-deps-from=flathub --install --force-clean --repo=repo build world.aaina.AainaDesktop.yml
      - name: Flathub's check of the built app
        working-directory: packaging/flathub
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo || echo "::warning::repo lint has findings (some only apply on Flathub's own build servers)"
      - name: Open it
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c '
            printf e2e | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            flatpak run world.aaina.AainaDesktop > out/app.log 2>&1 &
            sleep 30
            import -window root out/flathub.png
            flatpak ps | grep -q world.aaina.AainaDesktop || { cat out/app.log; echo "The app closed on its own"; exit 1; }
            flatpak kill world.aaina.AainaDesktop'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: store-flathub
          path: out/
          if-no-files-found: ignore

  winget:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make sure winget is here
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: winget's own check of the manifest
        shell: pwsh
        run: |
          $dir = Get-ChildItem packaging/winget/manifests -Recurse -Filter *.installer.yaml | Select-Object -First 1
          winget validate --manifest $dir.DirectoryName
          "MANIFEST=$($dir.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install with winget, as a person would
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The builds aren't signed yet, so Windows shows its "unrecognised app" warning once (a person clicks Run anyway,
          # as the README says). Nobody can click it on a test machine, so it is switched off here only.
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name EnableSmartScreen -Value 0 -Type DWord
          # Same for the "Do you want to run this file?" prompt on files downloaded from the internet.
          New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments" -Name SaveZoneInformation -Value 1 -Type DWord
          $env:SEE_MASK_NOZONECHECKS = "1"
          winget settings --enable LocalManifestFiles
          winget install --manifest $env:MANIFEST --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --verbose-logs
          if ($LASTEXITCODE -ne 0) { throw "winget install failed: $LASTEXITCODE" }
      - name: Open it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "aaina-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "The installed app was not found" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("out/winget.png")
          if ($app.HasExited) { throw "The app closed on its own" }
          Stop-Process -Id $app.Id
      - name: Keep winget's own log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue | Copy-Item -Destination out -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: store-winget
          path: out/
          if-no-files-found: ignore

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Put the cask in a local tap
        run: |
          brew tap-new --no-git aaina-world/test
          tap="$(brew --repository)/Library/Taps/aaina-world/homebrew-test"
          mkdir -p "$tap/Casks"
          cp packaging/homebrew/Casks/aaina-desktop.rb "$tap/Casks/"
      - name: Homebrew's own check
        run: brew audit --cask --online --strict aaina-world/test/aaina-desktop || echo "::warning::brew audit has findings"
      - name: Install with Homebrew, as a person would
        run: brew install --cask aaina-world/test/aaina-desktop
      - name: Open it
        run: |
          mkdir -p out
          # Started directly, as macOS's Open Anyway would: the test machine can't click that.
          "/Applications/Aaina Desktop.app/Contents/MacOS/aaina-desktop" > out/app.log 2>&1 &
          app=$!
          sleep 25
          screencapture -x out/homebrew.png || true
          kill -0 $app || { cat out/app.log; echo "The app closed on its own"; exit 1; }
          kill $app
      - name: Uninstall cleanly
        run: brew uninstall --cask --zap aaina-world/test/aaina-desktop
      - name: The public tap installs the same way (brew install aaina-world/tap/aaina-desktop)
        run: |
          brew install --cask aaina-world/tap/aaina-desktop
          test -d "/Applications/Aaina Desktop.app"
          brew uninstall --cask --zap aaina-world/tap/aaina-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: store-homebrew
          path: out/
          if-no-files-found: ignore
