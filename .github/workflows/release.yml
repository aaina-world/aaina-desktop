name: Release

# Push a tag like v0.1.0 to build installers for Mac, Windows and Linux.
# A draft GitHub release is created; publish it by hand when you have tried the files.
#
# Builds are unsigned for now: the system warns the first time someone opens the app.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Every check CI runs, on this exact commit, before anything is built.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    permissions:
      contents: write
      id-token: write # signed build provenance (attestations)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux packages for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To sign the Mac app later, add these secrets and lines (an empty one makes the build try to sign and fail):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aaina Desktop ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Builds are unsigned unless noted; your system may warn the first time you open the app."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Signed proof, by GitHub, that these files were built here from this commit. Check one with:
      #   gh attestation verify <file> -R aaina-world/aaina-desktop
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      # Smoke test: install what was just built on this fresh machine (the Mac one from its .dmg), open it, check it keeps running, and keep a
      # screenshot (Actions run page, Artifacts) so Windows and Linux can be checked without owning either.
      - name: Smoke test (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y xvfb imagemagick dbus-x11 gnome-keyring
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          dbus-run-session -- sh -c 'aaina-desktop & echo $! > /tmp/app.pid; sleep 25; import -window root smoke-linux.png; kill -0 $(cat /tmp/app.pid)'
      - name: Smoke test (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "aaina" -and $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "The installed app was not found" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke-windows.png")
          if ($app.HasExited) { throw "The app closed on its own" }
      - name: Smoke test (Mac)
        if: matrix.platform == 'macos-latest'
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/aaina-dmg -nobrowse
          cp -R "/tmp/aaina-dmg/Aaina Desktop.app" /Applications/
          hdiutil detach /tmp/aaina-dmg
          xattr -dr com.apple.quarantine "/Applications/Aaina Desktop.app" || true
          "/Applications/Aaina Desktop.app/Contents/MacOS/aaina-desktop" > app.log 2>&1 &
          app=$!
          sleep 25
          screencapture -x smoke-mac.png || true
          kill -0 $app || { cat app.log; echo "The app closed on its own"; exit 1; }
          kill $app
      - name: Keep the smoke test screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.platform }}
          path: smoke-*.png
          if-no-files-found: ignore

  # One checksum list for every file of the release, so a download can be checked against it.
  checksums:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Add SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" -R "$REPO"
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$REPO" --clobber
