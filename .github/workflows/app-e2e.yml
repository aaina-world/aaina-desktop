name: App end to end

# Builds the real app on fresh Windows and Linux machines and drives it like a person would (WebDriver through
# tauri-driver on Linux, the WebView2 DevTools port of a test build on Windows):
# welcome, connecting OpenAI (a made-up key that OpenAI must refuse, so the app really reaches OpenAI and the key goes
# through the system keychain), the photos folder, the studio catalogue, models, a new shoot, settings, and opening the
# app again. Before that, the keychain itself is tested with a long value (Credential Manager, GNOME Keyring).
# Screenshots of every step are kept under Artifacts on the run page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# With the OPENAI_API_KEY secret, releases and manual runs also make one real photo per system (about $0.06 each).
# Everyday pushes never get the key, and it is given only to the step that drives the app, never to installs or builds.
permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libssl-dev \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - run: npm ci
      - name: Build the app
        if: runner.os == 'Linux'
        run: npx tauri build --no-bundle
      - name: Build the app (with the DevTools port the test uses)
        if: runner.os == 'Windows'
        run: |
          node e2e-app/windows-config.mjs
          npx tauri build --no-bundle --config e2e-app/windows.conf.json
      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      - name: Keychain (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            set -e
            printf e2e | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            cargo test --manifest-path src-tauri/Cargo.toml -- --ignored'
      - name: App (Linux)
        if: runner.os == 'Linux'
        env:
          OPENAI_API_KEY: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && secrets.OPENAI_API_KEY || '' }}
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c '
            set -e
            printf e2e | gnome-keyring-daemon --unlock --components=secrets --daemonize > /dev/null
            tauri-driver > e2e-app/driver.log 2>&1 &
            sleep 3
            node e2e-app/run.mjs "$PWD/src-tauri/target/release/aaina-desktop"'

      - name: Keychain (Windows)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
      - name: App (Windows)
        if: runner.os == 'Windows'
        env:
          OPENAI_API_KEY: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && secrets.OPENAI_API_KEY || '' }}
        run: node e2e-app/run.mjs "$PWD\src-tauri\target\release\aaina-desktop.exe"
        shell: pwsh

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.platform }}
          path: |
            e2e-app/out/
            e2e-app/driver.log
          if-no-files-found: ignore

  # The Mac has no WebDriver for its web view, so here the real keychain is tested with a long value and the built app
  # is opened, checked to keep running and photographed. (The release opens the .dmg the same way.)
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Keychain (Mac)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
      - name: Build the app
        run: npx tauri build --no-bundle
      - name: Open the app
        run: |
          mkdir -p e2e-app/out
          src-tauri/target/release/aaina-desktop > e2e-app/out/app.log 2>&1 &
          app=$!
          sleep 25
          screencapture -x e2e-app/out/mac.png || true
          kill -0 $app || { cat e2e-app/out/app.log; echo "The app closed on its own"; exit 1; }
          kill $app
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-macos
          path: e2e-app/out/
          if-no-files-found: ignore
